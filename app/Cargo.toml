[package]
name = "fluxer-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
# Spike: path dep on the local clone. Switch to `git + rev` once the spike is accepted.
rune = { path = "../ref/rune/crates/rune" }
fluxer-client = { path = "../crates/fluxer-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
rune-kit = { path = "../ref/rune/crates/rune-kit", features = ["markdown"] }
