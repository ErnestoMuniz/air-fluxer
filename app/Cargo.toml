[package]
name = "fluxer-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
# Spike: path dep on the local clone. Switch to `git + rev` once the spike is accepted.
rune = { path = "../ref/rune/crates/rune", features = ["native-file-dialog"] }
fluxer-client = { path = "../crates/fluxer-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
livekit = { version = "0.10", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
rune-kit = { path = "../ref/rune/crates/rune-kit", features = ["markdown"] }
nnnoiseless = "0.5"
emojis = "0.9"
# Animated pictures are decoded a frame at a time (see anim.rs), not all at once as Rune's cache does.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png"] }

# Voice goes through the system's own audio server: PipeWire/PulseAudio on Linux, CoreAudio on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"

# The frame-cost test measures this thread's CPU time, not wall time (other tests run beside it).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
