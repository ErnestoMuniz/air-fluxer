[package]
name = "fluxer-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
# Spike: path dep on the local clone. Switch to `git + rev` once the spike is accepted.
rune = { path = "../ref/rune/crates/rune", features = ["native-file-dialog"] }
fluxer-client = { path = "../crates/fluxer-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
livekit = { version = "0.10", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
rune-kit = { path = "../ref/rune/crates/rune-kit", features = ["markdown"] }
nnnoiseless = "0.5"
libpulse-binding = "2"
libpulse-simple-binding = "2"
emojis = "0.9"
